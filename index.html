<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 أنمي ون بيس · الحلقات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0b0e1a;
            --bg-secondary: #11162b;
            --bg-card: rgba(16, 22, 48, 0.92);
            --border-color: rgba(50, 130, 255, 0.2);
            --border-hover: rgba(60, 150, 255, 0.5);
            --text-primary: #eef4ff;
            --text-secondary: #a8c0ff;
            --text-muted: #5b75a0;
            --blue-main: #2a7fff;
            --blue-hover: #4a9eff;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --radius: 20px;
            --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية الصورة مع Blur ===== */
        .background-image {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjGb3JDb1n2BOHvgnWo3F4npYiffjAj-HhJ0rOllORdgXnWjXcY97xTeOP0gNi_4gzsqLKxMAjD5tRMl_H3uc5jZRRqu2A_g6fsJ1-PQ8BCKpffPjKZzAmm7D1i6gm1NmkSkUcNvOWPNOsB/s1600/One-Piece-Monkey-D-Luffy-Wallpapers-003.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px);
            opacity: 0.4; 
            pointer-events: none;
        }
        
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, rgba(20, 60, 180, 0.03), transparent 70%),
                        radial-gradient(ellipse at 50% 100%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
        }

        .app {
            width: min(920px, 98vw);
            position: relative;
            z-index: 2;
        }
        .card {
            position: relative;
            padding: 28px 26px 24px;
            border-radius: var(--radius);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            transition: var(--transition);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #5b9eff, #2a7fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title span {
            background: rgba(42, 127, 255, 0.12);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            -webkit-text-fill-color: var(--text-secondary);
            border: 1px solid rgba(42, 127, 255, 0.1);
        }
        .status-badge {
            font-size: 13px;
            color: var(--text-secondary);
            background: rgba(42, 127, 255, 0.06);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(42, 127, 255, 0.06);
        }
        
        /* ===== تنسيق السلايدر والتنقل ===== */
        .episodes-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            direction: ltr;
            flex-wrap: wrap;
        }

        .nav-btn, .page-btn {
            width: 42px;
            height: 42px;
            background-color: #2d3238;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-family: inherit;
        }

        .nav-btn:hover, .page-btn:hover {
            background-color: var(--blue-main);
            border-color: var(--blue-main);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            background-color: #2d3238;
            border-color: #4a5568;
        }

        .page-btn.active {
            background: linear-gradient(135deg, var(--blue-main), var(--blue-hover));
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(42, 127, 255, 0.3);
        }

        /* خانة إدخال رقم الحلقة */
        .ep-input {
            width: 60px;
            height: 42px;
            background-color: #2d3238;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: var(--transition);
        }
        .ep-input:focus {
            border-color: var(--blue-main);
            box-shadow: 0 0 10px rgba(42, 127, 255, 0.2);
        }

        /* ===== شبكة الحلقات ===== */
        .episodes-container {
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            padding-left: 4px;
        }
        .episodes-container::-webkit-scrollbar {
            width: 6px;
        }
        .episodes-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .episodes-container::-webkit-scrollbar-thumb {
            background: rgba(42, 127, 255, 0.3);
            border-radius: 10px;
        }
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }
        
        /* تصميم مربع الحلقة المحسن */
        .episode-card {
            position: relative;
            background: linear-gradient(145deg, rgba(20, 30, 70, 0.9), rgba(10, 15, 40, 0.9));
            border: 1px solid rgba(42, 127, 255, 0.15);
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
        }
        
        .episode-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(42, 127, 255, 0.1) 0%, transparent 60%);
            opacity: 0;
            transition: var(--transition);
        }

        .episode-card:hover {
            border-color: var(--blue-main);
            transform: translateY(-5px) scale(1.03);
            box-shadow: 0 10px 30px rgba(42, 127, 255, 0.15);
        }

        .episode-card:hover::before {
            opacity: 1;
        }

        .episode-card .ep-num {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 15px rgba(42, 127, 255, 0.3);
        }
        
        .episode-card .ep-status {
            font-size: 12px;
            color: var(--text-secondary);
            background: rgba(42, 127, 255, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(42, 127, 255, 0.1);
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }
        
        .episode-card .play-icon {
            font-size: 24px;
            color: var(--blue-hover);
            margin-top: 10px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .episode-card:hover .play-icon {
            opacity: 1;
            transform: translateY(0);
        }

        .episodes-stats {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(42, 127, 255, 0.05);
        }
        .episodes-stats strong {
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* ===== تنسيق المشغل ===== */
        .player-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(6, 8, 20, 0.97);
            backdrop-filter: blur(30px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player-overlay.active {
            display: flex;
        }
        .player-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .player-header .site-name {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #5b9eff, #2a7fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .player-header .close-player {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: 20px;
            padding: 4px 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        .player-header .close-player:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .player-info {
            color: var(--text-secondary);
            font-size: 18px;
            margin-bottom: 16px;
            z-index: 5;
            text-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .player-overlay video {
            max-width: 95vw;
            max-height: 78vh;
            border-radius: 16px;
            border: 1px solid rgba(42, 127, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            z-index: 5;
            background: #000;
        }
        .player-error {
            color: #ff6b6b;
            font-size: 18px;
            margin-top: 16px;
            z-index: 5;
            display: none;
            background: rgba(255, 80, 80, 0.04);
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 80, 80, 0.06);
        }
        .player-error.show {
            display: block;
        }

        @media (max-width: 650px) {
            .card { padding: 20px 14px; }
            .title { font-size: 24px; }
            .episodes-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .episode-card .ep-num { font-size: 20px; }
            .player-overlay video { max-height: 60vh; }
            .header { flex-direction: column; align-items: flex-start; }
            .nav-btn, .page-btn { width: 35px; height: 35px; font-size: 13px; }
            .ep-input { width: 50px; height: 35px; font-size: 14px; }
        }
        @media (max-width: 400px) {
            .episodes-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="background-image"></div>
<div class="vignette"></div>

<!-- ===== PLAYER OVERLAY ===== -->
<div class="player-overlay" id="playerOverlay">
    <div class="player-header">
        <div class="site-name">🎬 أنمي </div>
        <button class="close-player" id="closePlayerBtn">✕ إغلاق</button>
    </div>
    <div class="player-info" id="playerInfo">جاري التحميل...</div>
    <video id="playerVideo" controls autoplay></video>
    <div class="player-error" id="playerError">❌الحلقة غير متوفره </div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app">
    <div class="card">
        <div class="header">
            <div class="title">
                📺 الحلقات
                <span>ون بيس </span>
            </div>
            <div class="status-badge" id="statusBadge">✅</div>
        </div>

        <!-- السلايدر والتنقل -->
        <div class="episodes-nav-container">
            <button class="nav-btn" id="prev-btn">&#10094;</button>
            
            <div id="pagination-buttons" style="display: flex; gap: 8px; align-items: center;"></div>
            
            <!-- خانة إدخال رقم الحلقة -->
            <input type="number" class="ep-input" id="epInput" placeholder="رقم" min="1" max="1176" title="اكتب رقم الحلقة ثم اضغط Enter">
            
            <button class="nav-btn" id="next-btn">&#10095;</button>
        </div>

        <div class="episodes-container" id="episodesContainer">
            <div id="episodesGrid" class="episodes-grid"></div>
            <div class="episodes-stats" id="epStats">
                <span>! <strong id="totalFound">0</strong> حلقة متاحة</span>
                <span>!! <strong id="availableCount">0</strong> قابلة للتشغيل</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        //  CONFIG
        // ============================================================
        const BASE_URL_1 = 'https://server.sanime.net/Video2/532/';   
        const BASE_URL_2 = 'https://server.sanime.net/Video/532/';    
        const MAX_EP = 1176; 
        const ITEMS_PER_PAGE = 45;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const grid = document.getElementById('episodesGrid');
        const paginationButtons = document.getElementById('pagination-buttons');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const epInput = document.getElementById('epInput');
        const totalFoundEl = document.getElementById('totalFound');
        const availableCountEl = document.getElementById('availableCount');
        const statusBadge = document.getElementById('statusBadge');

        const playerOverlay = document.getElementById('playerOverlay');
        const playerVideo = document.getElementById('playerVideo');
        const playerInfo = document.getElementById('playerInfo');
        const playerError = document.getElementById('playerError');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        // ============================================================
        //  STATE
        // ============================================================
        let allEpisodes = [];
        let currentPage = 1;
        let totalEpisodes = 0;

        // ============================================================
        //  EPISODE LOADER (بدون مكسور)
        // ============================================================
        function loadEpisodes() {
            const episodes = [];
            // هنا نقوم بتوليد الحلقات، كلها متاحة (لأنك طلبت شيل المكسور نهائياً)
            for (let i = 1; i <= MAX_EP; i++) {
                episodes.push({ num: i, status: 'available' });
            }

            allEpisodes = episodes;
            totalEpisodes = episodes.length;

            availableCountEl.textContent = totalEpisodes;
            statusBadge.textContent = `✅ ${totalEpisodes} ّ`;

            currentPage = 1;
            renderEpisodes();
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderEpisodes() {
            if (allEpisodes.length === 0) {
                grid.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text-muted);">لا توجد حلقات متاحة</div>`;
                renderPagination(1);
                return;
            }

            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = Math.min(start + ITEMS_PER_PAGE, totalEpisodes);
            const pageItems = allEpisodes.slice(start, end);

            let html = '';
            for (let ep of pageItems) {
                html += `
                    <div class="episode-card" data-ep="${ep.num}">
                        <div class="ep-num">${ep.num}</div>
                        <div class="ep-status">متوفرة</div>
                        <div class="play-icon">▶</div>
                    </div>
                `;
            }
            grid.innerHTML = html;

            document.querySelectorAll('.episode-card').forEach(el => {
                el.addEventListener('click', function() {
                    const ep = parseInt(this.dataset.ep);
                    openPlayer(ep);
                });
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationButtons.innerHTML = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            
            const current = currentPage;
            
            let html = '';

            // عرض أول 3 صفحات دائماً إذا كنا في البداية
            if (current <= 3) {
                for (let i = 1; i <= Math.min(3, totalPages); i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                if (totalPages > 4) {
                    html += `<span style="color:#fff;padding:0 2px;">...</span>`;
                    html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
                }
            } else if (current >= totalPages - 1) {
                // في النهاية
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                html += `<span style="color:#fff;padding:0 2px;">...</span>`;
                for (let i = totalPages - 2; i <= totalPages; i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
            } else {
                // في المنتصف
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                html += `<span style="color:#fff;padding:0 2px;">...</span>`;
                for (let i = current - 1; i <= current + 1; i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                html += `<span style="color:#fff;padding:0 2px;">...</span>`;
                html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            paginationButtons.innerHTML = html;

            // تفعيل وتعطيل أزرار السابق والتالي
            prevBtn.disabled = current <= 1;
            nextBtn.disabled = current >= totalPages;
        }

        // دالة تغيير الصفحة
        window.changePage = function(page) {
            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderEpisodes();
            const container = document.getElementById('episodesContainer');
            if (container) container.scrollTop = 0;
        };

        // إصلاح أزرار السابق والتالي
        prevBtn.addEventListener('click', function() {
            if (currentPage > 1) changePage(currentPage - 1);
        });

        nextBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            if (currentPage < totalPages) changePage(currentPage + 1);
        });

        // دالة القفز لرقم محدد (خانة الإدخال)
        epInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = parseInt(this.value);
                if (val >= 1 && val <= totalEpisodes) {
                    const targetPage = Math.ceil(val / ITEMS_PER_PAGE);
                    changePage(targetPage);
                    this.value = ''; // مسح الحقل بعد القفز
                    
                    // البحث عن الحلقة داخل الصفحة وفتحها (اختياري)
                    // إذا أردت فتح الحلقة فوراً عند الإدخال، أزل التعليق عن السطر التالي:
                    // openPlayer(val);
                } else {
                    alert('الرجاء إدخال رقم صحيح بين 1 و ' + totalEpisodes);
                }
            }
        });

        // ============================================================
        //  PLAYER
        // ============================================================
        function openPlayer(ep) {
            const isAbove1073 = ep >= 1074;
            const baseUrl = isAbove1073 ? BASE_URL_2 : BASE_URL_1;
            const url = `${baseUrl}${ep}.mp4?download=true`;

            playerVideo.src = url;
            playerInfo.textContent = `🎬 الحلقة ${ep}`;
            playerError.classList.remove('show');
            playerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            playerVideo.onerror = function() {
                playerError.classList.add('show');
                playerError.textContent = `❌ الحلقة ${ep} غير متوفرة  `;
                playerInfo.textContent = `❌ الحلقة ${ep} - غير متوفرة`;
            };

            playerVideo.oncanplay = function() {
                playerError.classList.remove('show');
                playerInfo.textContent = `▶ الحلقة ${ep}`;
            };

            playerVideo.load();
        }

        function closePlayer() {
            playerOverlay.classList.remove('active');
            playerVideo.pause();
            playerVideo.src = '';
            playerVideo.load();
            document.body.style.overflow = 'auto';
            playerError.classList.remove('show');
            playerInfo.textContent = 'جاري التحميل...';
        }

        closePlayerBtn.addEventListener('click', closePlayer);
        playerOverlay.addEventListener('click', function(e) {
            if (e.target === playerOverlay) closePlayer();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (playerOverlay.classList.contains('active')) closePlayer();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        loadEpisodes();

    })();
</script>
</body>
</html>
