<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎬 أنمي ون بيس · الحلقات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0b0e1a;
            --bg-secondary: #11162b;
            --bg-card: rgba(16, 22, 48, 0.92);
            --border-color: rgba(50, 130, 255, 0.2);
            --border-hover: rgba(60, 150, 255, 0.5);
            --text-primary: #eef4ff;
            --text-secondary: #a8c0ff;
            --text-muted: #5b75a0;
            --blue-main: #2a7fff;
            --blue-hover: #4a9eff;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --radius: 20px;
            --transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== خلفية الصورة مع Blur ===== */
        .background-image {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjGb3JDb1n2BOHvgnWo3F4npYiffjAj-HhJ0rOllORdgXnWjXcY97xTeOP0gNi_4gzsqLKxMAjD5tRMl_H3uc5jZRRqu2A_g6fsJ1-PQ8BCKpffPjKZzAmm7D1i6gm1NmkSkUcNvOWPNOsB/s1600/One-Piece-Monkey-D-Luffy-Wallpapers-003.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(12px);
            opacity: 0.4; 
            pointer-events: none;
        }
        
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 50%, rgba(20, 60, 180, 0.03), transparent 70%),
                        radial-gradient(ellipse at 50% 100%, transparent 40%, rgba(0, 0, 0, 0.7) 100%);
        }

        .app {
            width: min(920px, 98vw);
            position: relative;
            z-index: 2;
        }
        .card {
            position: relative;
            padding: 20px 16px 18px;
            border-radius: var(--radius);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            transition: var(--transition);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title {
            font-size: clamp(22px, 5vw, 30px);
            font-weight: 800;
            background: linear-gradient(135deg, #5b9eff, #2a7fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .title span {
            background: rgba(42, 127, 255, 0.12);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: clamp(11px, 2vw, 13px);
            font-weight: 600;
            -webkit-text-fill-color: var(--text-secondary);
            border: 1px solid rgba(42, 127, 255, 0.1);
            white-space: nowrap;
        }
        .status-badge {
            font-size: clamp(12px, 1.8vw, 14px);
            color: var(--text-secondary);
            background: rgba(42, 127, 255, 0.06);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(42, 127, 255, 0.06);
        }
        
        /* ===== تنسيق السلايدر والتنقل ===== */
        .episodes-nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 16px;
            direction: ltr;
            flex-wrap: wrap;
        }

        .nav-btn, .page-btn {
            width: clamp(36px, 6vw, 44px);
            height: clamp(36px, 6vw, 44px);
            background-color: #2d3238;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: clamp(13px, 2vw, 16px);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-family: inherit;
            flex-shrink: 0;
        }

        .nav-btn:hover, .page-btn:hover {
            background-color: var(--blue-main);
            border-color: var(--blue-main);
            transform: translateY(-2px);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
            background-color: #2d3238;
            border-color: #4a5568;
        }

        .page-btn.active {
            background: linear-gradient(135deg, var(--blue-main), var(--blue-hover));
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(42, 127, 255, 0.3);
        }

        /* خانة إدخال رقم الحلقة */
        .ep-input {
            width: clamp(50px, 8vw, 65px);
            height: clamp(36px, 6vw, 44px);
            background-color: #2d3238;
            border: 1px solid #4a5568;
            border-radius: 8px;
            color: #ffffff;
            font-size: clamp(14px, 2vw, 17px);
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: var(--transition);
        }
        .ep-input:focus {
            border-color: var(--blue-main);
            box-shadow: 0 0 10px rgba(42, 127, 255, 0.2);
        }
        /* إخفاء أزرار التحكم في حقل الرقم على المتصفحات */
        .ep-input::-webkit-outer-spin-button,
        .ep-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .ep-input[type=number] {
            -moz-appearance: textfield;
        }

        /* ===== شبكة الحلقات ===== */
        .episodes-container {
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            padding-left: 2px;
            padding-right: 2px;
        }
        .episodes-container::-webkit-scrollbar {
            width: 5px;
        }
        .episodes-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 10px;
        }
        .episodes-container::-webkit-scrollbar-thumb {
            background: rgba(42, 127, 255, 0.3);
            border-radius: 10px;
        }
        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }
        
        /* تصميم مربع الحلقة المحسن */
        .episode-card {
            position: relative;
            background: linear-gradient(145deg, rgba(20, 30, 70, 0.9), rgba(10, 15, 40, 0.9));
            border: 1px solid rgba(42, 127, 255, 0.15);
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .episode-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(42, 127, 255, 0.1) 0%, transparent 60%);
            opacity: 0;
            transition: var(--transition);
        }

        .episode-card:hover {
            border-color: var(--blue-main);
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 30px rgba(42, 127, 255, 0.15);
        }

        .episode-card:hover::before {
            opacity: 1;
        }

        .episode-card .ep-num {
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
            text-shadow: 0 0 15px rgba(42, 127, 255, 0.3);
            line-height: 1.2;
        }
        
        .episode-card .ep-status {
            font-size: clamp(10px, 1.5vw, 12px);
            color: var(--text-secondary);
            background: rgba(42, 127, 255, 0.1);
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid rgba(42, 127, 255, 0.1);
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
            white-space: nowrap;
        }
        
        .episode-card .play-icon {
            font-size: clamp(18px, 3vw, 24px);
            color: var(--blue-hover);
            margin-top: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: var(--transition);
            position: relative;
            z-index: 1;
        }

        .episode-card:hover .play-icon {
            opacity: 1;
            transform: translateY(0);
        }

        .episodes-stats {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            color: var(--text-muted);
            font-size: clamp(12px, 1.8vw, 14px);
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(42, 127, 255, 0.05);
        }
        .episodes-stats strong {
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* ===== تنسيق المشغل ===== */
        .player-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(6, 8, 20, 0.97);
            backdrop-filter: blur(30px);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .player-overlay.active {
            display: flex;
        }
        .player-header {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            gap: 10px;
            padding: 0 8px;
        }
        .player-header .site-name {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 800;
            background: linear-gradient(135deg, #5b9eff, #2a7fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .player-header .close-player {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            font-size: clamp(14px, 2.5vw, 20px);
            padding: 2px 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            white-space: nowrap;
        }
        .player-header .close-player:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }
        .player-info {
            color: var(--text-secondary);
            font-size: clamp(14px, 2.5vw, 20px);
            margin-bottom: 10px;
            z-index: 5;
            text-shadow: 0 0 30px rgba(0,0,0,0.5);
            text-align: center;
            padding: 0 10px;
        }
        .player-overlay video {
            max-width: 98vw;
            max-height: 75vh;
            width: auto;
            height: auto;
            border-radius: 12px;
            border: 1px solid rgba(42, 127, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            z-index: 5;
            background: #000;
            aspect-ratio: 16 / 9;
            object-fit: contain;
        }
        .player-error {
            color: #ff6b6b;
            font-size: clamp(14px, 2vw, 18px);
            margin-top: 12px;
            z-index: 5;
            display: none;
            background: rgba(255, 80, 80, 0.04);
            padding: 6px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 80, 80, 0.06);
            text-align: center;
        }
        .player-error.show {
            display: block;
        }

        /* ===== تحسينات إضافية للشاشات الصغيرة ===== */
        @media (max-width: 650px) {
            .card { padding: 16px 10px; }
            .header { flex-direction: row; align-items: center; gap: 6px; }
            .episodes-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .episode-card { min-height: 80px; padding: 10px 6px; }
            .episode-card .ep-num { font-size: 18px; }
            .episode-card .ep-status { font-size: 10px; padding: 2px 8px; }
            .player-overlay video { max-height: 60vh; }
            .nav-btn, .page-btn { width: 34px; height: 34px; font-size: 12px; }
            .ep-input { width: 46px; height: 34px; font-size: 13px; }
            .episodes-nav-container { gap: 4px; }
        }

        @media (max-width: 400px) {
            .episodes-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .episode-card { min-height: 70px; padding: 8px 4px; }
            .episode-card .ep-num { font-size: 16px; }
            .card { padding: 12px 8px; border-radius: 14px; }
            .title { font-size: 18px; }
            .title span { font-size: 10px; padding: 1px 8px; }
            .status-badge { font-size: 10px; padding: 3px 10px; }
        }

        @media (max-width: 350px) {
            .episodes-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .episode-card { min-height: 60px; padding: 6px 4px; border-radius: 10px; }
            .episode-card .ep-num { font-size: 14px; }
            .episode-card .ep-status { font-size: 8px; padding: 1px 6px; }
            .episode-card .play-icon { font-size: 14px; margin-top: 4px; }
            .nav-btn, .page-btn { width: 30px; height: 30px; font-size: 10px; border-radius: 6px; }
            .ep-input { width: 40px; height: 30px; font-size: 11px; }
            .episodes-nav-container { gap: 3px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .app { width: min(920px, 95vw); }
            .card { padding: 12px 14px; }
            .header { margin-bottom: 10px; }
            .episodes-nav-container { margin-bottom: 10px; }
            .episodes-container { max-height: 60vh; }
            .episodes-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
            .episode-card { min-height: 60px; padding: 8px 6px; }
            .episode-card .ep-num { font-size: 16px; margin-bottom: 2px; }
            .episode-card .ep-status { font-size: 9px; padding: 1px 8px; }
            .episode-card .play-icon { font-size: 14px; margin-top: 4px; }
            .player-overlay video { max-height: 70vh; }
            .player-info { margin-bottom: 4px; }
            .player-header { top: 6px; }
        }
    </style>
</head>
<body>

<div class="background-image"></div>
<div class="vignette"></div>

<!-- ===== PLAYER OVERLAY ===== -->
<div class="player-overlay" id="playerOverlay">
    <div class="player-header">
        <div class="site-name">🎬 أنمي</div>
        <button class="close-player" id="closePlayerBtn">✕ إغلاق</button>
    </div>
    <div class="player-info" id="playerInfo">جاري التحميل...</div>
    <video id="playerVideo" controls autoplay playsinline></video>
    <div class="player-error" id="playerError">❌ الحلقة غير متوفره</div>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app">
    <div class="card">
        <div class="header">
            <div class="title">
                📺 الحلقات
                <span>ون بيس</span>
            </div>
            <div class="status-badge" id="statusBadge">✅</div>
        </div>

        <!-- السلايدر والتنقل -->
        <div class="episodes-nav-container">
            <button class="nav-btn" id="prev-btn">&#10094;</button>
            
            <div id="pagination-buttons" style="display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: center;"></div>
            
            <!-- خانة إدخال رقم الحلقة -->
            <input type="number" class="ep-input" id="epInput" placeholder="رقم" min="1" max="1176" title="اكتب رقم الحلقة ثم اضغط Enter" inputmode="numeric">
            
            <button class="nav-btn" id="next-btn">&#10095;</button>
        </div>

        <div class="episodes-container" id="episodesContainer">
            <div id="episodesGrid" class="episodes-grid"></div>
            <div class="episodes-stats" id="epStats">
                <span>! <strong id="totalFound">0</strong> حلقه غير متاحة</span>
                <span>!! <strong id="availableCount">0</strong> قابلة للتشغيل</span>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ============================================================
        //  CONFIG
        // ============================================================
        const BASE_URL_1 = 'https://server.sanime.net/Video2/532/';   
        const BASE_URL_2 = 'https://server.sanime.net/Video/532/';    
        const MAX_EP = 1176; 
        const ITEMS_PER_PAGE = 45;

        // ============================================================
        //  DOM REFS
        // ============================================================
        const grid = document.getElementById('episodesGrid');
        const paginationButtons = document.getElementById('pagination-buttons');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const epInput = document.getElementById('epInput');
        const totalFoundEl = document.getElementById('totalFound');
        const availableCountEl = document.getElementById('availableCount');
        const statusBadge = document.getElementById('statusBadge');

        const playerOverlay = document.getElementById('playerOverlay');
        const playerVideo = document.getElementById('playerVideo');
        const playerInfo = document.getElementById('playerInfo');
        const playerError = document.getElementById('playerError');
        const closePlayerBtn = document.getElementById('closePlayerBtn');

        // ============================================================
        //  STATE
        // ============================================================
        let allEpisodes = [];
        let currentPage = 1;
        let totalEpisodes = 0;

        // ============================================================
        //  EPISODE LOADER (بدون مكسور)
        // ============================================================
        function loadEpisodes() {
            const episodes = [];
            for (let i = 1; i <= MAX_EP; i++) {
                episodes.push({ num: i, status: 'available' });
            }

            allEpisodes = episodes;
            totalEpisodes = episodes.length;

            availableCountEl.textContent = totalEpisodes;
            statusBadge.textContent = `✅ ${totalEpisodes} حلقة`;

            currentPage = 1;
            renderEpisodes();
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderEpisodes() {
            if (allEpisodes.length === 0) {
                grid.innerHTML = `<div style="text-align:center;padding:40px 0;color:var(--text-muted);">لا توجد حلقات متاحة</div>`;
                renderPagination(1);
                return;
            }

            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = Math.min(start + ITEMS_PER_PAGE, totalEpisodes);
            const pageItems = allEpisodes.slice(start, end);

            let html = '';
            for (let ep of pageItems) {
                html += `
                    <div class="episode-card" data-ep="${ep.num}">
                        <div class="ep-num">${ep.num}</div>
                        <div class="ep-status">متوفرة</div>
                        <div class="play-icon">▶</div>
                    </div>
                `;
            }
            grid.innerHTML = html;

            document.querySelectorAll('.episode-card').forEach(el => {
                el.addEventListener('click', function() {
                    const ep = parseInt(this.dataset.ep);
                    openPlayer(ep);
                });
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationButtons.innerHTML = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }
            
            const current = currentPage;
            let html = '';

            if (current <= 3) {
                for (let i = 1; i <= Math.min(3, totalPages); i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                if (totalPages > 4) {
                    html += `<span style="color:#fff;padding:0 2px;font-size:clamp(12px,1.5vw,16px);">...</span>`;
                    html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
                }
            } else if (current >= totalPages - 1) {
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                html += `<span style="color:#fff;padding:0 2px;font-size:clamp(12px,1.5vw,16px);">...</span>`;
                for (let i = totalPages - 2; i <= totalPages; i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
            } else {
                html += `<button class="page-btn" onclick="changePage(1)">1</button>`;
                html += `<span style="color:#fff;padding:0 2px;font-size:clamp(12px,1.5vw,16px);">...</span>`;
                for (let i = current - 1; i <= current + 1; i++) {
                    html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                html += `<span style="color:#fff;padding:0 2px;font-size:clamp(12px,1.5vw,16px);">...</span>`;
                html += `<button class="page-btn" onclick="changePage(${totalPages})">${totalPages}</button>`;
            }

            paginationButtons.innerHTML = html;
            prevBtn.disabled = current <= 1;
            nextBtn.disabled = current >= totalPages;
        }

        window.changePage = function(page) {
            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderEpisodes();
            const container = document.getElementById('episodesContainer');
            if (container) container.scrollTop = 0;
        };

        prevBtn.addEventListener('click', function() {
            if (currentPage > 1) changePage(currentPage - 1);
        });

        nextBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(totalEpisodes / ITEMS_PER_PAGE);
            if (currentPage < totalPages) changePage(currentPage + 1);
        });

        epInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const val = parseInt(this.value);
                if (val >= 1 && val <= totalEpisodes) {
                    const targetPage = Math.ceil(val / ITEMS_PER_PAGE);
                    changePage(targetPage);
                    this.value = '';
                } else {
                    alert('الرجاء إدخال رقم صحيح بين 1 و ' + totalEpisodes);
                }
            }
        });

        // ============================================================
        //  PLAYER
        // ============================================================
        function openPlayer(ep) {
            const isAbove1073 = ep >= 1074;
            const baseUrl = isAbove1073 ? BASE_URL_2 : BASE_URL_1;
            const url = `${baseUrl}${ep}.mp4?download=true`;

            playerVideo.src = url;
            playerInfo.textContent = `🎬 الحلقة ${ep}`;
            playerError.classList.remove('show');
            playerOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            playerVideo.onerror = function() {
                playerError.classList.add('show');
                playerError.textContent = `❌ الحلقة ${ep} غير متوفرة`;
                playerInfo.textContent = `❌ الحلقة ${ep} - غير متوفرة`;
            };

            playerVideo.oncanplay = function() {
                playerError.classList.remove('show');
                playerInfo.textContent = `▶ الحلقة ${ep}`;
            };

            playerVideo.load();
        }

        function closePlayer() {
            playerOverlay.classList.remove('active');
            playerVideo.pause();
            playerVideo.src = '';
            playerVideo.load();
            document.body.style.overflow = 'auto';
            playerError.classList.remove('show');
            playerInfo.textContent = 'جاري التحميل...';
        }

        closePlayerBtn.addEventListener('click', closePlayer);
        playerOverlay.addEventListener('click', function(e) {
            if (e.target === playerOverlay) closePlayer();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (playerOverlay.classList.contains('active')) closePlayer();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        loadEpisodes();

    })();
</script>
</body>
</html>
